<!doctype html>
<html lang="en">
  <body>
    <button aria-label="Filter options" aria-expanded="false"></button>
    <ul role="tree" aria-label="File Tree">
      <li id="src/app.ts" role="treeitem" aria-label="app.ts">
        <div class="tree-item-visual" aria-hidden="true"><svg class="octicon octicon-file-diff"></svg></div>
        <a href="#diff-app">app.ts</a>
      </li>
      <li id="src/new.ts" role="treeitem" aria-label="new.ts">
        <div class="tree-item-visual" aria-hidden="true"><svg class="octicon octicon-file-added"></svg></div>
        <a href="#diff-new">new.ts</a>
      </li>
      <li id="src/generated.ts" role="treeitem" aria-label="generated.ts">
        <div class="tree-item-visual" aria-hidden="true"><svg class="octicon octicon-file-diff"></svg></div>
        <a href="#diff-generated">generated.ts</a>
      </li>
      <li id="docs/readme.md" role="treeitem" aria-label="readme.md">
        <div class="tree-item-visual" aria-hidden="true"><svg class="octicon octicon-file-diff"></svg></div>
        <a href="#diff-viewed">readme.md</a>
      </li>
      <li id="config/app.json" role="treeitem" aria-label="app.json">
        <div class="tree-item-visual" aria-hidden="true"><svg class="octicon octicon-file-diff"></svg></div>
        <a href="#diff-config">app.json</a>
      </li>
    </ul>

    <div id="diff-app" role="region" aria-labelledby="heading-app">
      <div data-diff-header-wrapper="true">
        <button aria-label="Collapse file"></button>
        <h3 id="heading-app"><a href="#diff-app"><code>src/app.ts</code></a></h3>
        <button aria-label="Not Viewed" aria-pressed="false">Viewed</button>
      </div>
      <div data-diff-anchor="diff-app">modified diff</div>
    </div>

    <div id="diff-new" role="region" aria-labelledby="heading-new">
      <div data-diff-header-wrapper="true">
        <button aria-label="Collapse file"></button>
        <h3 id="heading-new"><a href="#diff-new"><code>src/new.ts</code></a></h3>
        <button aria-label="Not Viewed" aria-pressed="false">Viewed</button>
      </div>
      <div data-diff-anchor="diff-new">added diff</div>
    </div>

    <div id="diff-generated" role="region" aria-labelledby="heading-generated">
      <div data-diff-header-wrapper="true">
        <button aria-label="Collapse file"></button>
        <a href="/owner/repo/blob/main/CODEOWNERS#L1" aria-describedby="owner-tip"></a>
        <span id="owner-tip" role="tooltip">
          Owned by @owner and @org/team (from CODEOWNERS line 1)
        </span>
        <h3 id="heading-generated">
          <a href="#diff-generated"><code>src/generated.ts</code></a>
        </h3>
        <button aria-label="Not Viewed" aria-pressed="false">Viewed</button>
      </div>
      <div data-diff-anchor="diff-generated">generated diff</div>
    </div>

    <div id="diff-viewed" role="region" aria-labelledby="heading-viewed">
      <div data-diff-header-wrapper="true">
        <button aria-label="Expand file"></button>
        <h3 id="heading-viewed">
          <a href="#diff-viewed"><code>docs/readme.md</code></a>
        </h3>
        <button aria-label="Viewed" aria-pressed="true">Viewed</button>
      </div>
    </div>

    <div id="diff-config" role="region" aria-labelledby="heading-config">
      <div data-diff-header-wrapper="true">
        <button aria-label="Collapse file"></button>
        <h3 id="heading-config">
          <a href="#diff-config"><code>config/app.json</code></a>
        </h3>
        <button aria-label="Not Viewed" aria-pressed="false">Viewed</button>
      </div>
      <div data-diff-anchor="diff-config">config diff</div>
    </div>
    <script>
      // Native interactions for the standalone browser fixture. DOM tests load only the markup.
      document.querySelector('[role="tree"][aria-label="File Tree"]').insertAdjacentHTML(
        'afterbegin',
        `
              <li id="src" role="treeitem" aria-label="src">
          <div class="tree-item-visual" aria-hidden="true">
            <svg class="octicon octicon-file-directory-fill"></svg>
          </div>
          <div>src</div>
        </li>
              <li id="docs" role="treeitem" aria-label="docs">
          <div class="tree-item-visual" aria-hidden="true">
            <svg class="octicon octicon-file-directory-fill"></svg>
          </div>
          <div>docs</div>
        </li>
        `,
      );
      // Every toast text ever shown: toasts are replaced or dismissed by
      // later events, so assertions read the history, not the screen.
      const toastLog = [];
      new MutationObserver(() => {
        for (const toast of document.querySelectorAll('[data-diffseek="snackbar"]')) {
          if (toastLog.at(-1) === toast.textContent) continue;
          toastLog.push(toast.textContent);
          document.documentElement.dataset.toastLog = toastLog.join('\n');
        }
      }).observe(document.documentElement, {
        childList: true,
        characterData: true,
        subtree: true,
      });
      document.documentElement.dataset.nativeActions = 'idle';
      let pendingNativeActions = 0;
      let nativeJsChecked = true;
      const commitNativeAction = (action) => {
        pendingNativeActions += 1;
        document.documentElement.dataset.nativeActions = 'pending';
        setTimeout(() => {
          action();
          pendingNativeActions -= 1;
          if (pendingNativeActions === 0) {
            document.documentElement.dataset.nativeActions = 'idle';
          }
        }, Number(document.documentElement.dataset.nativeDelay ?? 10));
      };
      document.addEventListener('click', (event) => {
        const clearNativeFilters = event.target.closest('button');
        if (clearNativeFilters?.textContent.trim() === 'Clear filters') {
          document.documentElement.dataset.nativeFilterCleared = 'true';
          clearNativeFilters.closest('[role="menu"]')?.remove();
          return;
        }
        const nativeFilter = event.target.closest(
          '[role="menuitemcheckbox"][aria-label=".js"]',
        );
        if (nativeFilter) {
          nativeJsChecked = !nativeJsChecked;
          nativeFilter.setAttribute(
            'aria-checked',
            String(nativeJsChecked),
          );
          nativeFilter.closest('[role="menu"]')?.remove();
          return;
        }
        const button = event.target.closest('button');
        if (!button) return;
        if (button.getAttribute('aria-label') === 'Filter options' || button.id === 'filter-options') {
          if (!document.querySelector('[role="menu"]')) {
            document.body.insertAdjacentHTML(
              'beforeend',
              '<ul role="menu" aria-label="Filter options">' +
                '<li role="menuitemcheckbox" aria-label=".js" aria-checked="' +
                nativeJsChecked +
                '">.js</li>' +
                '<li role="separator">Native separator</li>' +
                '</ul>',
            );
          }
        } else if (button.getAttribute('aria-label') === 'Collapse file') {
          commitNativeAction(() => button.setAttribute('aria-label', 'Expand file'));
        } else if (button.getAttribute('aria-label') === 'Expand file') {
          commitNativeAction(() => button.setAttribute('aria-label', 'Collapse file'));
        } else if (button.getAttribute('aria-label') === 'Not Viewed') {
          commitNativeAction(() => {
            button.setAttribute('aria-label', 'Viewed');
            button.setAttribute('aria-pressed', 'true');
          });
        } else if (button.getAttribute('aria-label') === 'Viewed') {
          commitNativeAction(() => {
            button.setAttribute('aria-label', 'Not Viewed');
            button.setAttribute('aria-pressed', 'false');
          });
        }
      });
    </script>
  </body>
</html>
