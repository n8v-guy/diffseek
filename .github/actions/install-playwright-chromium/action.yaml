name: Install Playwright Chromium
description: Cache ~/.cache/ms-playwright by lockfile Playwright version; install browsers on miss and OS deps on hit.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      run: |
        version="$(node -e "
          const lock = require('node:fs').readFileSync('pnpm-lock.yaml', 'utf8');
          const match = lock.match(/^ {2}'@playwright\\/test@([^']+)':/m);
          if (!match) throw new Error('@playwright/test version not found in pnpm-lock.yaml');
          process.stdout.write(match[1]);
        ")"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "Playwright ${version}"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright.outputs.version }}

    - name: Install Playwright Chromium and OS deps
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps --no-shell chromium

    - name: Install Playwright OS deps
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium
