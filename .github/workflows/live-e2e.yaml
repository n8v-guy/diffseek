name: Live E2E

on:
  workflow_dispatch:

concurrency:
  group: live-e2e
  cancel-in-progress: false

permissions: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: Prepare GitHub storageState
        env:
          DIFFSEEK_GITHUB_STORAGE_STATE: ${{ secrets.DIFFSEEK_GITHUB_STORAGE_STATE }}
        run: |
          if [ -z "$DIFFSEEK_GITHUB_STORAGE_STATE" ]; then
            echo 'Repository secret DIFFSEEK_GITHUB_STORAGE_STATE is required for live e2e.' >&2
            exit 1
          fi
          printf '%s' "$DIFFSEEK_GITHUB_STORAGE_STATE" > "$RUNNER_TEMP/github-storage.json"
      - name: Run live performance e2e
        env:
          DIFFSEEK_GITHUB_STORAGE_STATE: ${{ runner.temp }}/github-storage.json
        run: pnpm test:e2e:live
      - name: Upload live performance numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-perf
          path: .cache/live-perf-latest.json
          if-no-files-found: ignore

  start-release:
    needs: live
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: gh workflow run release.yaml --ref "$HEAD_SHA"
