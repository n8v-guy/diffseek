name: Live E2E

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit of the dispatched branch whose CI run succeeded
        required: true
        type: string
  pull_request:

permissions: {}

jobs:
  # Any branch can run this; only main starts a release (start-release and
  # release.yaml both require main). Fork and Dependabot pull requests get no
  # repository secrets.
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    # Samples share one GitHub session, so pull request and main runs wait in
    # one queue; queue: max keeps a pending main run from being replaced.
    concurrency:
      group: live-e2e
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # A pull request run requires the pull_request CI run of the same head.
      - name: Require the branch head and a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_EVENT: ${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$CI_EVENT" = push ] && [ "$HEAD_SHA" != "$RUN_SHA" ]; then
            echo "Live E2E for ${HEAD_SHA} was dispatched from ${RUN_SHA}." >&2
            exit 1
          fi
          run=$(gh run list --workflow ci.yaml --event "$CI_EVENT" --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // error("no CI run for this commit")')
          gh run watch "$run" --exit-status
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: Prepare GitHub storageState
        env:
          DIFFSEEK_GITHUB_STORAGE_STATE: ${{ secrets.DIFFSEEK_GITHUB_STORAGE_STATE }}
        run: |
          if [ -z "$DIFFSEEK_GITHUB_STORAGE_STATE" ]; then
            echo 'Repository secret DIFFSEEK_GITHUB_STORAGE_STATE is required for live e2e.' >&2
            exit 1
          fi
          printf '%s' "$DIFFSEEK_GITHUB_STORAGE_STATE" > "$RUNNER_TEMP/github-storage.json"
      - name: Run live performance e2e
        env:
          DIFFSEEK_GITHUB_STORAGE_STATE: ${{ runner.temp }}/github-storage.json
        run: pnpm test:e2e:live
      - name: Upload live performance numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-perf
          path: .cache/live-perf-latest.json
          if-no-files-found: ignore

  start-release:
    needs: live
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: gh workflow run release.yaml --repo "$GH_REPO" --ref main -f head_sha="$HEAD_SHA"
