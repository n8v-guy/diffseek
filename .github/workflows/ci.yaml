name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci:full

  strict:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:zip
      - run: pnpm zip:firefox:store
      - run: pnpm check:size
      - run: pnpm check:strict
      - if: ${{ !cancelled() }}
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint
      - if: ${{ !cancelled() }}
        run: pipx run zizmor==1.31.1 .github/workflows
