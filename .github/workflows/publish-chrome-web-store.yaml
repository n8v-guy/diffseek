name: Publish Chrome Web Store

# Manual only (GitHub app → Actions → this workflow → Run workflow, branch: main).
on:
  workflow_dispatch:

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch tip
        id: meta
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Run this workflow from the main branch (got ${{ github.ref }})." >&2
            exit 1
          fi
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Require prior stages green and resolve Release run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          require_workflow_success() {
            local name="$1"
            local run_json conclusion run_id
            run_json="$(
              gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
                | jq -c --arg name "$name" '
                  [.workflow_runs[]
                    | select(.name == $name and .status == "completed")]
                  | sort_by(.created_at)
                  | reverse
                  | .[0] // empty
                '
            )"
            if [ -z "$run_json" ]; then
              echo "Workflow \"${name}\" for ${SHA} has no completed run." >&2
              exit 1
            fi
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            run_id="$(jq -r '.id // empty' <<<"$run_json")"
            if [ "$conclusion" != "success" ]; then
              echo "Workflow \"${name}\" for ${SHA} is not success (got: ${conclusion:-none})." >&2
              exit 1
            fi
            echo "OK: ${name} → success (run ${run_id})"
            if [ "$name" = "Release Chrome Extension" ]; then
              echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
            fi
          }

          require_workflow_success "CI"
          require_workflow_success "Live E2E"
          require_workflow_success "Release Chrome Extension"

      - name: Download ZIP from Release workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require exactly one ZIP
        run: |
          shopt -s nullglob
          zips=(.output/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP artifact from the Release run, found ${#zips[@]}." >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          echo "Using ${zips[0]}"

      - name: Require Chrome Web Store secrets
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          missing=0
          for name in EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN PUBLISHER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret CHROME_${name}." >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          shopt -s nullglob
          zips=(.output/*.zip)
          npx --yes chrome-webstore-upload-cli@3 --source "${zips[0]}"
