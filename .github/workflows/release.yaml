name: Release Chrome Extension

on:
  workflow_run:
    workflows: [Live E2E]
    types: [completed]
    branches: [main]

concurrency:
  group: chrome-extension-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # workflow_run fires on failure too; a fully-skipped workflow is "success".
  gate:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Live E2E conclusion: ${{ github.event.workflow_run.conclusion }}" >&2
          exit 1

  zip:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:zip

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output/*.zip
          if-no-files-found: error
          # .output is a dot-directory; v4 skips hidden paths by default.
          include-hidden-files: true

  release:
    needs: [zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sha="${{ github.event.workflow_run.head_sha }}"
          zips=(.output/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected exactly one ZIP in .output, found ${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          zip="${zips[0]}"
          base=$(basename "$zip")
          case "$base" in
            diffseek-*-chrome.zip) ;;
            *)
              echo "unexpected ZIP name: $base" >&2
              exit 1
              ;;
          esac
          version="${base#diffseek-}"
          version="${version%-chrome.zip}"
          tag="v${version}"
          title="DiffSeek ${tag}"

          prev=""
          if git rev-parse -q --verify "${sha}^" >/dev/null; then
            prev=$(git describe --tags --match 'v*' --abbrev=0 "${sha}^" 2>/dev/null || true)
          fi

          notes=$(mktemp)
          {
            if [ -n "$prev" ]; then
              git log --format='%s' "${prev}..${sha}"
              echo
              echo "https://github.com/${{ github.repository }}/compare/${prev}...${tag}"
            else
              git log --format='%s' "$sha"
            fi
          } >"$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --title "$title" \
              --notes-file "$notes" \
              --target "$sha" \
              --latest
          fi
