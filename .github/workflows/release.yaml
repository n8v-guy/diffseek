name: Release Chrome Extension

on:
  workflow_run:
    workflows: [Live E2E]
    types: [completed]
    branches: [main]

concurrency:
  group: chrome-extension-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # workflow_run fires on failure too; a fully-skipped workflow is "success".
  gate:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Live E2E conclusion: ${{ github.event.workflow_run.conclusion }}" >&2
          exit 1

  zip:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:zip

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output/*.zip
          if-no-files-found: error
          # .output is a dot-directory; v4 skips hidden paths by default.
          include-hidden-files: true

  release:
    needs: [zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Chrome extension
          body: |
            commit: ${{ github.event.workflow_run.head_sha }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: .output/*.zip
          fail_on_unmatched_files: true
          make_latest: true

      - name: Keep only the newest ZIP on latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(.output/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected exactly one ZIP in .output, found ${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          new_zip=$(basename "${zips[0]}")
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if [ "$name" != "$new_zip" ]; then
              gh release delete-asset latest "$name" --yes
            fi
          done < <(gh release view latest --json assets --jq '.assets[].name')

      - name: Point latest tag at released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/latest" \
              -f sha="$sha" -F force=true
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/latest" -f sha="$sha"
          fi
