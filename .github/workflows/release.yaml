name: Release Chrome Extension

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Main commit whose CI and Live E2E runs succeeded
        required: true
        type: string

concurrency:
  group: chrome-extension-release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require CI and Live E2E success for this main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ]; then
            echo "Release runs from main only (got ${REF})." >&2
            exit 1
          fi
          if [ "$HEAD_SHA" != "$RUN_SHA" ]; then
            echo "Release for ${HEAD_SHA} was dispatched from ${RUN_SHA}." >&2
            exit 1
          fi
          for workflow in ci.yaml live-e2e.yaml; do
            run=$(gh run list --workflow "$workflow" --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
            gh run watch "$run" --exit-status
          done

  zip:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:zip

      - run: pnpm zip:firefox

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-extension-zip
          path: .output/*-chrome.zip
          if-no-files-found: error
          # .output is a dot-directory; v4 skips hidden paths by default.
          include-hidden-files: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firefox-extension-zips
          path: |
            .output/*-firefox.zip
            .output/*-sources.zip
          if-no-files-found: error
          include-hidden-files: true

  release:
    needs: zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chrome-extension-zip
          path: .output

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firefox-extension-zips
          path: .output

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sha="$HEAD_SHA"
          zips=(.output/*.zip)
          chrome=(.output/diffseek-*-chrome.zip)
          if [ "${#zips[@]}" -ne 3 ] || [ "${#chrome[@]}" -ne 1 ]; then
            echo "expected the Chrome, Firefox, and sources ZIPs in .output, found ${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          zip="${chrome[0]}"
          base=$(basename "$zip")
          version="${base#diffseek-}"
          version="${version%-chrome.zip}"
          firefox=".output/diffseek-${version}-firefox.zip"
          sources=".output/diffseek-${version}-sources.zip"
          if [ ! -f "$firefox" ] || [ ! -f "$sources" ]; then
            echo "missing Firefox ZIP or sources ZIP for ${version}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          tag="v${version}"
          title="DiffSeek ${tag}"

          prev=""
          if git rev-parse -q --verify "${sha}^" >/dev/null; then
            prev=$(git describe --tags --match 'v*' --abbrev=0 "${sha}^" 2>/dev/null || true)
          fi

          notes=$(mktemp)
          {
            if [ -n "$prev" ]; then
              git log --format='%s' "${prev}..${sha}"
              echo
              echo "https://github.com/${REPO}/compare/${prev}...${tag}"
            else
              git log --format='%s' "$sha"
            fi
          } >"$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" "$firefox" "$sources" --clobber
          else
            gh release create "$tag" "$zip" "$firefox" "$sources" \
              --title "$title" \
              --notes-file "$notes" \
              --target "$sha" \
              --latest
          fi
