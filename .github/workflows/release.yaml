name: Release Chrome Extension

on:
  workflow_dispatch:

concurrency:
  group: chrome-extension-release
  cancel-in-progress: false

permissions: {}

jobs:
  main-only:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a release from any branch but main
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Release runs from main only (got ${REF})." >&2
          exit 1

  zip:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-extension-zip
          path: .output/*.zip
          if-no-files-found: error
          # .output is a dot-directory; v4 skips hidden paths by default.
          include-hidden-files: true

  release:
    needs: [zip]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chrome-extension-zip
          path: .output

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sha="$HEAD_SHA"
          zips=(.output/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected exactly one ZIP in .output, found ${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          zip="${zips[0]}"
          base=$(basename "$zip")
          case "$base" in
            diffseek-*-chrome.zip) ;;
            *)
              echo "unexpected ZIP name: $base" >&2
              exit 1
              ;;
          esac
          version="${base#diffseek-}"
          version="${version%-chrome.zip}"
          tag="v${version}"
          title="DiffSeek ${tag}"

          prev=""
          if git rev-parse -q --verify "${sha}^" >/dev/null; then
            prev=$(git describe --tags --match 'v*' --abbrev=0 "${sha}^" 2>/dev/null || true)
          fi

          notes=$(mktemp)
          {
            if [ -n "$prev" ]; then
              git log --format='%s' "${prev}..${sha}"
              echo
              echo "https://github.com/${REPO}/compare/${prev}...${tag}"
            else
              git log --format='%s' "$sha"
            fi
          } >"$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --title "$title" \
              --notes-file "$notes" \
              --target "$sha" \
              --latest
          fi
