name: Release Chrome Extension

on:
  workflow_run:
    workflows: [Live E2E]
    types: [completed]
    branches: [main]

concurrency:
  group: chrome-extension-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # workflow_run fires on failure too; a fully-skipped workflow is "success".
  gate:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Live E2E conclusion: ${{ github.event.workflow_run.conclusion }}" >&2
          exit 1

  zip:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:zip

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output/*.zip
          if-no-files-found: error
          # .output is a dot-directory; v4 skips hidden paths by default.
          include-hidden-files: true

  release:
    needs: [zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Chrome extension
          body: |
            commit: ${{ github.event.workflow_run.head_sha }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: .output/*.zip
          fail_on_unmatched_files: true
          make_latest: true
